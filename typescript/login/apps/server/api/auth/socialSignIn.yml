info:
  name: socialSignIn
  type: http
  seq: 1
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/api/auth/sign-in/social"
  body:
    type: json
    data: |-
      {
        "callbackURL": "",
        "newUserCallbackURL": "",
        "errorCallbackURL": "",
        "provider": "",
        "disableRedirect": false,
        "idToken": {
          "token": "",
          "nonce": "",
          "accessToken": "",
          "refreshToken": "",
          "expiresAt": 0,
          "user": {
            "name": {
              "firstName": "",
              "lastName": ""
            },
            "email": ""
          }
        },
        "scopes": [],
        "requestSignUp": false,
        "loginHint": "",
        "additionalData": {}
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

