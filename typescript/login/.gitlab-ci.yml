# 由 playground 根目錄的 .gitlab-ci.yml 用 include:local 引入。
# 觸發條件（是否建立 pipeline）由根目錄的 workflow.rules 決定，這裡只定義 job 本身。

.login:
  image: node:24
  before_script:
    - cd typescript/login
    - corepack enable # 依 package.json 的 packageManager 取得 pnpm 10.34.5
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [typescript/login/pnpm-lock.yaml]
    paths: [typescript/login/.pnpm-store]

login:dbml:
  extends: .login
  script:
    - pnpm --filter @ims/db db:dbml
    - |
      if ! git diff --exit-code -- packages/db/docs/schema.dbml; then
        echo "schema.dbml 與 Drizzle schema 不同步。請在本地執行 'pnpm --filter @ims/db db:dbml' 並提交產物。"
        exit 1
      fi

login:api:
  extends: .login
  # 不需要 postgres service：postgres.js 的連線池是 lazy 的，產 spec 的過程
  # 不會實際連線。這些變數只是要通過 auth.ts / @ims/db 的存在性檢查。
  variables:
    DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything
    BETTER_AUTH_URL: http://localhost:3000
  script:
    - pnpm --filter @ims/server api:generate
    - |
      if ! git diff --exit-code -- apps/server/docs apps/server/api; then
        echo "openapi.json / Bruno collection 與路由不同步。請在本地執行 'pnpm --filter @ims/server api:generate' 並提交產物。"
        exit 1
      fi
