info:
  name: 修改目前計數
  type: http
  seq: 2
  tags:
    - counter

http:
  method: PUT
  url: "{{baseUrl}}/api/counter"
  body:
    type: json
    data: |-
      {
        "count": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Default Response
    request:
      url: "{{baseUrl}}/api/counter"
      method: PUT
      body:
        type: json
        data: |-
          {
            "count": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 0,
            "updatedAt": ""
          }
